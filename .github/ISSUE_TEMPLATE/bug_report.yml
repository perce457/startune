name: Bug report
description: Report a reproducible problem in StarTune.
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: "Do not include passwords, API keys, or access tokens."

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Jellyfin plugin
        - Web client
        - Smart playlists
        - Installation or packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin version
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
